# محیط توسعهٔ محلی.
# نکتهٔ مهم: MongoDB به‌صورت Replica Set تک‌نودی بالا می‌آید، چون تراکنش‌های
# چندسندی (رزرو موجودی + ثبت سفارش، بخش ۵.۴) بدون Replica Set کار نمی‌کنند.
services:
  mongo:
    image: mongo:8
    container_name: igbz-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-init:
    image: mongo:8
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:27017 --quiet --eval '
          try {
            rs.status();
            print("replica set already initialized");
          } catch (e) {
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]});
            print("replica set initialized");
          }
        '

volumes:
  mongo-data:
